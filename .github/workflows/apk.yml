          fun Modifier.glass(shape: Shape): Modifier = this
              .clip(shape)
              .background(Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.32f), Color.White.copy(alpha = 0.14f))))
              .border(1.dp, Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.55f), Color.White.copy(alpha = 0.08f))), shape)

          @Composable
          fun HomeScreen(tick: Int) {
              val ctx = LocalContext.current
              var apps by remember { mutableStateOf(emptyList<AppItem>()) }
              LaunchedEffect(tick) { apps = withContext(Dispatchers.IO) { loadApps(ctx) } }

              val dock = remember(apps) { pickDock(ctx, apps) }
              val grid = remember(apps) { apps.filter { it !in dock } }
              val pages = remember(grid) { listOf(grid.take(12)) + grid.drop(12).chunked(20) }
              val pager = rememberPagerState(pageCount = { pages.size })

              var frame by remember { mutableStateOf(false) }
              var mode by remember { mutableStateOf(IslandMode.Idle) }
              var expanded by remember { mutableStateOf(false) }
              var secs by remember { mutableIntStateOf(42) }
              val battery by rememberBattery()
              var seen by remember { mutableStateOf(false) }

              BackHandler { }

              LaunchedEffect(Unit) { while (true) { delay(1000); secs++ } }

              LaunchedEffect(battery.second) {
                  if (!seen) { seen = true; return@LaunchedEffect }
                  if (battery.second) {
                      mode = IslandMode.Charging
                      expanded = false
                      delay(3500)
                      if (mode == IslandMode.Charging) { mode = IslandMode.Idle; expanded = false }
                  }
              }

              Box(Modifier.fillMaxSize()) {
                  Box(
                      Modifier
                          .fillMaxSize()
                          .background(Brush.verticalGradient(listOf(Color.Black.copy(alpha = 0.25f), Color.Transparent, Color.Black.copy(alpha = 0.35f))))
                  )

                  Column(Modifier.fillMaxSize()) {
                      Spacer(Modifier.height(64.dp))
                      HorizontalPager(pager, Modifier.weight(1f)) { p ->
                          AppPage(p, pages.getOrElse(p) { emptyList() }) { launchApp(ctx, it) }
                      }
                      Row(
                          Modifier
                              .fillMaxWidth()
                              .padding(vertical = 8.dp),
                          horizontalArrangement = Arrangement.Center
                      ) {
                          repeat(pages.size) { i ->
                              Box(
                                  Modifier
                                      .padding(horizontal = 4.dp)
                                      .size(7.dp)
                                      .clip(CircleShape)
                                      .background(if (i == pager.currentPage) Color.White else Color.White.copy(alpha = 0.4f))
                              )
                          }
                      }
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.Center) {
                          Row(
                              Modifier
                                  .glass(CircleShape)
                                  .height(36.dp)
                                  .padding(horizontal = 22.dp)
                                  .pointerInput(Unit) { detectTapGestures(onLongPress = { frame = !frame }) },
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Icon(Icons.Filled.Search, null, tint = Color.White.copy(alpha = 0.9f), modifier = Modifier.size(16.dp))
                              Spacer(Modifier.width(6.dp))
                              Text("Search", color = Color.White.copy(alpha = 0.9f), fontSize = 14.sp)
                          }
                      }
                      Row(
                          Modifier
                              .fillMaxWidth()
                              .padding(start = 12.dp, end = 12.dp, top = 10.dp, bottom = 14.dp)
                              .glass(RoundedCornerShape(38.dp))
                              .height(94.dp)
                              .padding(horizontal = 14.dp),
                          horizontalArrangement = Arrangement.SpaceEvenly,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          dock.forEach { app ->
                              Image(
                                  app.icon, app.label,
                                  Modifier
                                      .size(60.dp)
                                      .clip(RoundedCornerShape(13.5.dp))
                                      .clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) { launchApp(ctx, app) }
                              )
                          }
                      }
                  }

                  Box(
                      Modifier
                          .align(Alignment.TopCenter)
                          .padding(top = 11.dp)
                  ) {
                      StatusRow(battery.first, battery.second)
                  }
                  DynamicIsland(
                      mode = mode,
                      expanded = expanded,
                      level = battery.first,
                      secs = secs,
                      onTap = {
                          if (mode == IslandMode.Idle) { mode = IslandMode.Music; expanded = false }
                          else if (!expanded) expanded = true
                          else { expanded = false; mode = IslandMode.Idle }
                      },
                      onLong = {
                          mode = IslandMode.values()[(mode.ordinal + 1) % IslandMode.values().size]
                          expanded = false
                      },
                      onDismiss = { expanded = false; mode = IslandMode.Idle },
                      modifier = Modifier
                          .align(Alignment.TopCenter)
                          .padding(top = 11.dp)
                  )

                  if (frame) Bezel()
              }
          }

          @Composable
          private fun AppPage(page: Int, apps: List<AppItem>, onOpen: (AppItem) -> Unit) {
              Column(
                  Modifier
                      .fillMaxSize()
                      .padding(horizontal = 16.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  if (page == 0) DateWidget()
                  apps.chunked(4).forEach { row ->
                      Row(Modifier.fillMaxWidth()) {
                          row.forEach { AppCell(it, Modifier.weight(1f), onOpen) }
                          repeat(4 - row.size) { Spacer(Modifier.weight(1f)) }
                      }
                  }
              }
          }

          @Composable
          private fun AppCell(app: AppItem, modifier: Modifier, onOpen: (AppItem) -> Unit) {
              Column(
                  modifier.clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) { onOpen(app) },
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Image(app.icon, app.label, Modifier.size(60.dp).clip(RoundedCornerShape(13.5.dp)))
                  Spacer(Modifier.height(5.dp))
                  Text(
                      app.label, color = Color.White, fontSize = 11.sp,
                      maxLines = 1, overflow = TextOverflow.Ellipsis, textAlign = TextAlign.Center
                  )
              }
          }

          @Composable
          private fun DateWidget() {
              val today = LocalDate.now()
              Column(
                  Modifier
                      .fillMaxWidth()
                      .glass(RoundedCornerShape(24.dp))
                      .height(150.dp)
                      .padding(18.dp)
              ) {
                  Text(
                      today.dayOfWeek.getDisplayName(JTextStyle.FULL, Locale.getDefault()).uppercase(),
                      color = Color(0xFFFF453A), fontSize = 13.sp, fontWeight = FontWeight.SemiBold
                  )
                  Text(today.dayOfMonth.toString(), color = Color.White, fontSize = 52.sp, fontWeight = FontWeight.Light)
                  Spacer(Modifier.weight(1f))
                  Text("No events today", color = Color.White.copy(alpha = 0.75f), fontSize = 14.sp)
              }
          }

          @Composable
          private fun StatusRow(level: Int, charging: Boolean) {
              val time by produceState("") {
                  while (true) {
                      val now = LocalTime.now()
                      value = now.format(DateTimeFormatter.ofPattern("h:mm"))
                      delay((60 - now.second) * 1000L)
                  }
              }
              Row(Modifier.fillMaxWidth().height(37.dp), verticalAlignment = Alignment.CenterVertically) {
                  Box(Modifier.weight(1f), contentAlignment = Alignment.Center) {
                      Text(time, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.SemiBold)
                  }
                  Spacer(Modifier.width(130.dp))
                  Row(
                      Modifier.weight(1f),
                      horizontalArrangement = Arrangement.spacedBy(6.dp, Alignment.CenterHorizontally),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      SignalBars()
                      Icon(Icons.Filled.Wifi, null, tint = Color.White, modifier = Modifier.size(16.dp))
                      BatteryIcon(level, charging)
                  }
              }
          }

          @Composable
          private fun SignalBars() {
              Canvas(Modifier.size(18.dp, 12.dp)) {
                  val bw = 3.dp.toPx()
                  for (i in 0 until 4) {
                      val bh = size.height * (0.4f + 0.2f * i)
                      drawRoundRect(
                          Color.White, Offset(i * (bw + 1.dp.toPx()), size.height - bh),
                          Size(bw, bh), CornerRadius(1.dp.toPx())
                      )
                  }
              }
          }

          @Composable
          private fun BatteryIcon(level: Int, charging: Boolean) {
              Canvas(Modifier.size(27.dp, 13.dp)) {
                  val bodyW = size.width - 3.dp.toPx()
                  val ghost = Color.White.copy(alpha = 0.4f)
                  drawRoundRect(ghost, Offset.Zero, Size(bodyW, size.height), CornerRadius(4.dp.toPx()), style = Stroke(1.dp.toPx()))
                  val inset = 2.dp.toPx()
                  val fillW = (bodyW - inset * 2) * level.coerceIn(0, 100) / 100f
                  val c = when {
                      charging -> Color(0xFF30D158)
                      level <= 20 -> Color(0xFFFF453A)
                      else -> Color.White
                  }
                  drawRoundRect(c, Offset(inset, inset), Size(fillW, size.height - inset * 2), CornerRadius(2.dp.toPx()))
                  drawRoundRect(ghost, Offset(bodyW + 1.dp.toPx(), size.height * 0.33f), Size(1.5.dp.toPx(), size.height * 0.34f), CornerRadius(1.dp.toPx()))
              }
          }

          @Composable
          private fun Bezel() {
              Box(
                  Modifier
                      .fillMaxSize()
                      .graphicsLayer { compositingStrategy = CompositingStrategy.Offscreen }
                      .drawWithContent {
                          drawContent()
                          val inset = 10.dp.toPx()
                          val r = CornerRadius(56.dp.toPx())
                          drawRect(Color.Black)
                          drawRoundRect(
                              Color.Transparent, Offset(inset, inset),
                              Size(size.width - inset * 2, size.height - inset * 2), r,
                              blendMode = BlendMode.Clear
                          )
                          drawRoundRect(
                              Color(0xFF2A2A2C), Offset(inset / 2, inset / 2),
                              Size(size.width - inset, size.height - inset),
                              CornerRadius(61.dp.toPx()), style = Stroke(2.dp.toPx())
                          )
                      }
              )
          }

          @Composable
          private fun rememberBattery(): State<Pair<Int, Boolean>> {
              val ctx = LocalContext.current
              val state = remember { mutableStateOf(80 to false) }
              DisposableEffect(Unit) {
                  val receiver = object : BroadcastReceiver() {
                      override fun onReceive(c: Context?, i: Intent) {
                          val lvl = i.getIntExtra(BatteryManager.EXTRA_LEVEL, 0) * 100 / i.getIntExtra(BatteryManager.EXTRA_SCALE, 100)
                          val plugged = i.getIntExtra(BatteryManager.EXTRA_PLUGGED, 0) != 0
                          state.value = lvl to plugged
                      }
                  }
                  val sticky = ctx.registerReceiver(receiver, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  sticky?.let { receiver.onReceive(ctx, it) }
                  onDispose { ctx.unregisterReceiver(receiver) }
              }
              return state
          }
          KTEOF
          mkdir -p app/src/main/java/com/eddefi/iosl
          cat > app/src/main/java/com/eddefi/iosl/MainActivity.kt <<'KTEOF'
          package com.eddefi.iosl

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : ComponentActivity() {
              private val tick = mutableIntStateOf(0)

              override fun onCreate(savedInstanceState: Bundle?) {
                  enableEdgeToEdge()
                  super.onCreate(savedInstanceState)
                  setContent { HomeScreen(tick.intValue) }
              }

              override fun onResume() {
                  super.onResume()
                  tick.intValue++
                  hideStatusBar()
              }

              private fun hideStatusBar() {
                  val c = WindowCompat.getInsetsController(window, window.decorView)
                  c.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  c.hide(WindowInsetsCompat.Type.statusBars())
              }
          }
