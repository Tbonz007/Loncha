          @Composable
          private fun CircleButton(bg: Color, tint: Color, icon: ImageVector, onClick: () -> Unit) {
              Box(
                  Modifier
                      .size(48.dp)
                      .clip(CircleShape)
                      .background(bg)
                      .clickable { onClick() },
                  contentAlignment = Alignment.Center
              ) { Icon(icon, null, tint = tint, modifier = Modifier.size(24.dp)) }
