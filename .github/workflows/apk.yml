          package com.eddefi.iosl

          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.provider.MediaStore
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.core.graphics.drawable.toBitmap

          data class AppItem(
              val label: String,
              val pkg: String,
              val cls: String,
              val icon: ImageBitmap
          )

          fun loadApps(ctx: Context): List<AppItem> {
              val pm = ctx.packageManager
              val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
              return pm.queryIntentActivities(intent, 0)
                  .filter { it.activityInfo.packageName != ctx.packageName }
                  .map {
                      AppItem(
                          label = it.loadLabel(pm).toString(),
                          pkg = it.activityInfo.packageName,
                          cls = it.activityInfo.name,
                          icon = it.loadIcon(pm).toBitmap(160, 160).asImageBitmap()
                      )
                  }
                  .sortedBy { it.label.lowercase() }
          }

          fun pickDock(ctx: Context, apps: List<AppItem>): List<AppItem> {
              val pm = ctx.packageManager
              val probes = listOf(
                  Intent(Intent.ACTION_DIAL),
                  Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:")),
                  Intent(Intent.ACTION_VIEW, Uri.parse("https://www.example.com")),
                  Intent(MediaStore.ACTION_IMAGE_CAPTURE)
              )
              val picked = probes
                  .mapNotNull { pm.resolveActivity(it, PackageManager.MATCH_DEFAULT_ONLY)?.activityInfo?.packageName }
                  .mapNotNull { p -> apps.firstOrNull { it.pkg == p } }
                  .distinct()
              return (picked + apps.filter { it !in picked }).take(4)
          }

          fun launchApp(ctx: Context, app: AppItem) {
              try {
                  ctx.startActivity(
                      Intent(Intent.ACTION_MAIN)
                          .addCategory(Intent.CATEGORY_LAUNCHER)
                          .setClassName(app.pkg, app.cls)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
              } catch (_: Exception) {
              }
          }
