          IOSLauncher

          1. Open this folder in Android Studio (Koala or newer). Let Gradle sync.
          2. Run it on a phone or emulator running Android 10 or newer.
          3. Press the Home button and choose "Home" as your default launcher.

          Controls
          Tap the island: starts a demo, expands it, then closes it.
          Long press the island: switches between Music, Timer, Call and Charging.
          Plug in a charger: the island shows the charging pill by itself.
          Long press the Search pill: turns the iPhone bezel frame on or off.
