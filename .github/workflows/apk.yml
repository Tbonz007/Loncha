          @Composable
          private fun Art(size: Dp, corner: Dp) {
              Box(
                  Modifier
                      .size(size)
                      .clip(RoundedCornerShape(corner))
                      .background(Brush.linearGradient(listOf(Pink, Color(0xFF5E5CE6))))
              )
          }

          @Composable
          private fun Equalizer(color: Color, modifier: Modifier) {
              val t = rememberInfiniteTransition(label = "eq")
              val a by t.animateFloat(0.3f, 1f, infiniteRepeatable(tween(420, easing = LinearEasing), RepeatMode.Reverse), label = "a")
              val b by t.animateFloat(0.3f, 1f, infiniteRepeatable(tween(560, easing = LinearEasing), RepeatMode.Reverse), label = "b")
              val c by t.animateFloat(0.3f, 1f, infiniteRepeatable(tween(350, easing = LinearEasing), RepeatMode.Reverse), label = "c")
              val d by t.animateFloat(0.3f, 1f, infiniteRepeatable(tween(480, easing = LinearEasing), RepeatMode.Reverse), label = "d")
              Canvas(modifier) {
                  val bw = size.width / 7f
                  listOf(a, b, c, d).forEachIndexed { i, v ->
                      val bh = size.height * v
                      drawRoundRect(
                          color,
                          Offset(i * 2 * bw, size.height - bh),
                          Size(bw, bh),
                          CornerRadius(bw / 2)
                      )
                  }
              }
          }
