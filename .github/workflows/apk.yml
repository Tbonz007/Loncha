                              .clip(CircleShape)
                              .background(Color.White.copy(alpha = 0.18f)),
                          contentAlignment = Alignment.Center
                      ) { Icon(Icons.Filled.MicOff, null, tint = Color.White, modifier = Modifier.size(20.dp)) }
                      Box(
                          Modifier
                              .weight(1f)
                              .height(38.dp)
                              .clip(CircleShape)
                              .background(Red)
                              .clickable { onDismiss() },
                          contentAlignment = Alignment.Center
                      ) { Icon(Icons.Filled.CallEnd, null, tint = Color.White, modifier = Modifier.size(20.dp)) }
                  }
              }
          }

          @Composable
          private fun ChargingExpanded(level: Int) {
              Row(
                  Modifier
                      .fillMaxSize()
                      .padding(horizontal = 24.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Icon(Icons.Filled.BatteryChargingFull, null, tint = Green, modifier = Modifier.size(36.dp))
                  Spacer(Modifier.width(14.dp))
                  Column(Modifier.weight(1f)) {
                      Text("Charging", color = Color.White.copy(alpha = 0.6f), fontSize = 13.sp)
                      Text("$level%", color = Green, fontSize = 28.sp, fontWeight = FontWeight.Bold)
