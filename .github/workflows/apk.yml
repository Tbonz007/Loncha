          enum class IslandMode { Idle, Music, Timer, Call, Charging }

          private data class IslandKey(val mode: IslandMode, val expanded: Boolean)

          private val Orange = Color(0xFFFF9F0A)
          private val Green = Color(0xFF30D158)
          private val Red = Color(0xFFFF453A)
          private val Pink = Color(0xFFFF2D55)

          private fun fmt(sec: Int) = String.format("%d:%02d", sec / 60, sec % 60)

          @Composable
          fun DynamicIsland(
              mode: IslandMode,
              expanded: Boolean,
              level: Int,
              secs: Int,
              onTap: () -> Unit,
              onLong: () -> Unit,
              onDismiss: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              val screenW = LocalConfiguration.current.screenWidthDp.dp
              val expW = minOf(358.dp, screenW - 24.dp)

              val (tw, th) = when {
                  mode == IslandMode.Idle -> 126.dp to 37.dp
                  !expanded -> 190.dp to 37.dp
                  else -> expW to when (mode) {
                      IslandMode.Music -> 170.dp
                      IslandMode.Timer -> 112.dp
                      IslandMode.Call -> 124.dp
                      IslandMode.Charging -> 96.dp
                      else -> 37.dp
                  }
              }

              val w by animateDpAsState(tw, spring(dampingRatio = 0.62f, stiffness = 320f), label = "w")
              val h by animateDpAsState(th, spring(dampingRatio = 0.62f, stiffness = 320f), label = "h")
              val radius: Dp = minOf(h / 2, 44.dp)

              Box(
                  modifier
                      .size(w, h)
                      .clip(RoundedCornerShape(radius))
                      .background(Color.Black)
                      .pointerInput(mode, expanded) {
                          detectTapGestures(onTap = { onTap() }, onLongPress = { onLong() })
                      }
              ) {
                  AnimatedContent(
                      targetState = IslandKey(mode, expanded),
                      transitionSpec = {
                          (fadeIn(tween(220, 150)) + scaleIn(tween(220, 150), initialScale = 0.9f))
                              .togetherWith(fadeOut(tween(90)))
                              .using(SizeTransform(clip = false) { _, _ -> snap() })
                      },
                      modifier = Modifier.fillMaxSize(),
                      label = "island"
                  ) { key ->
                      when {
                          key.mode == IslandMode.Idle -> IdleContent()
                          !key.expanded -> CompactContent(key.mode, level, secs)
                          else -> ExpandedContent(key.mode, level, secs, onDismiss)
                      }
                  }
              }
          }

          @Composable
          private fun IdleContent() {
              Box(Modifier.fillMaxSize()) {
                  Box(
                      Modifier
                          .align(Alignment.CenterEnd)
                          .padding(end = 14.dp)
                          .size(10.dp)
                          .clip(CircleShape)
                          .background(Color(0xFF10101C))
                  )
              }
          }

          @Composable
          private fun CompactContent(mode: IslandMode, level: Int, secs: Int) {
              Row(
                  Modifier
                      .fillMaxSize()
                      .padding(horizontal = 14.dp),
                  horizontalArrangement = Arrangement.SpaceBetween,
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  when (mode) {
                      IslandMode.Music -> {
                          Art(22.dp, 6.dp)
                          Equalizer(Pink, Modifier.size(22.dp, 16.dp))
                      }
                      IslandMode.Timer -> {
                          Icon(Icons.Filled.Timer, null, tint = Orange, modifier = Modifier.size(20.dp))
                          Text(fmt(secs), color = Orange, fontSize = 14.sp, fontWeight = FontWeight.SemiBold, maxLines = 1)
                      }
                      IslandMode.Call -> {
                          Icon(Icons.Filled.Call, null, tint = Green, modifier = Modifier.size(18.dp))
                          Text(fmt(secs), color = Green, fontSize = 14.sp, fontWeight = FontWeight.SemiBold, maxLines = 1)
                      }
                      IslandMode.Charging -> {
                          Icon(Icons.Filled.BatteryChargingFull, null, tint = Green, modifier = Modifier.size(20.dp))
                          Text("$level%", color = Green, fontSize = 14.sp, fontWeight = FontWeight.SemiBold, maxLines = 1)
                      }
                      else -> {}
                  }
              }
          }

          @Composable
          private fun ExpandedContent(mode: IslandMode, level: Int, secs: Int, onDismiss: () -> Unit) {
              when (mode) {
                  IslandMode.Music -> MusicExpanded(secs)
                  IslandMode.Timer -> TimerExpanded(secs, onDismiss)
                  IslandMode.Call -> CallExpanded(secs, onDismiss)
                  IslandMode.Charging -> ChargingExpanded(level)
                  else -> {}
              }
          }

          @Composable
          private fun MusicExpanded(secs: Int) {
              val progress = (secs % 200) / 200f
              Column(
                  Modifier
                      .fillMaxSize()
                      .padding(horizontal = 20.dp, vertical = 16.dp),
                  verticalArrangement = Arrangement.SpaceBetween
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Art(54.dp, 10.dp)
                      Spacer(Modifier.width(12.dp))
                      Column(Modifier.weight(1f)) {
                          Text("Midnight Drive", color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.SemiBold, maxLines = 1)
                          Text("Neon Avenue", color = Color.White.copy(alpha = 0.6f), fontSize = 14.sp, maxLines = 1)
                      }
                      Equalizer(Pink, Modifier.size(24.dp, 20.dp))
                  }
                  Box(
                      Modifier
                          .fillMaxWidth()
                          .height(4.dp)
                          .clip(CircleShape)
                          .background(Color.White.copy(alpha = 0.25f))
                  ) {
                      Box(
                          Modifier
                              .fillMaxWidth(progress)
                              .height(4.dp)
                              .background(Color.White)
                      )
                  }
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                      Icon(Icons.Filled.SkipPrevious, null, tint = Color.White, modifier = Modifier.size(32.dp))
                      Icon(Icons.Filled.Pause, null, tint = Color.White, modifier = Modifier.size(32.dp))
                      Icon(Icons.Filled.SkipNext, null, tint = Color.White, modifier = Modifier.size(32.dp))
                  }
              }
          }

          @Composable
          private fun TimerExpanded(secs: Int, onDismiss: () -> Unit) {
              Row(
                  Modifier
                      .fillMaxSize()
                      .padding(horizontal = 22.dp),
