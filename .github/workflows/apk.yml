                          Text("Alex Morgan", color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.SemiBold, maxLines = 1)
                          Text("mobile  " + fmt(secs), color = Green, fontSize = 13.sp, maxLines = 1)
                      }
                      Equalizer(Green, Modifier.size(24.dp, 18.dp))
                  }
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      Box(
                          Modifier
                              .weight(1f)
